[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kdd-revision"
version = "0.2.0"
requires-python = ">=3.11"
description = "Reproducible A2 data cleaning and applied transformations for the UFG data-mining case study"
dependencies = ["pandas", "numpy", "scipy", "scikit-learn", "matplotlib", "joblib", "reportlab"]

[project.optional-dependencies]
notebook = ["nbformat", "nbclient", "ipykernel"]
test = ["pytest", "pypdf"]
dev = ["pytest", "pypdf", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
